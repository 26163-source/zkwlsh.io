<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36칸 룰렛 게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .instruction {
            background-color: #fff;
            border-radius: 8px;
            padding: 10px 20px;
            max-width: 300px;
            margin: 0 auto 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .key-badge {
            display: inline-block;
            background: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: bold;
        }

        .roulette-container {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 0 auto;
        }

        /* 상단 당첨 화살표 */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ffcc00;
            z-index: 10;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);
        }

        #result {
            margin-top: 25px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            height: 35px;
        }
    </style>
</head>
<body>

    <h1>🎯 룰렛 게임</h1>

    <div class="instruction">
        <p><span class="key-badge">Spacebar</span> 키를 눌러 룰렛을 돌리세요!</p>
    </div>

    <div class="roulette-container">
        <div class="pointer"></div>
        <canvas id="rouletteCanvas" width="360" height="360"></canvas>
    </div>

    <div id="result"></div>

    <script>
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');

        // 1부터 36까지 숫자 생성
        const numbers = Array.from({ length: 36 }, (_, i) => i + 1);
        const numSegments = numbers.length;
        const segmentAngle = 360 / numSegments; // 10도씩 36칸

        let isSpinning = false;
        let currentRotation = 0;

        // 룰렛 그리기
        function drawWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const num = numbers[i];
                const startAngle = (i * segmentAngle - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * segmentAngle - 90) * Math.PI / 180;

                // 홀수는 붉은색(#e74c3c), 짝수는 검은색(#2c3e50)
                const color = (num % 2 !== 0) ? '#e74c3c' : '#2c3e50';

                // 부채꼴 조각 그리기
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1;
                ctx.stroke();

                // 숫자 텍스트 입력
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + (segmentAngle * Math.PI / 360));
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px Arial";
                ctx.fillText(num, radius - 10, 4);
                ctx.restore();
            }
        }

        // 스페이스바 키 입력 감지
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 스페이스바 화면 스크롤 방지
                if (!isSpinning) {
                    spinWheel();
                }
            }
        });

        // 룰렛 회전 및 무작위 추첨 함수
        function spinWheel() {
            isSpinning = true;
            resultDiv.innerText = "룰렛이 돌고 있습니다...";

            // 1 ~ 36 사이 무작위 숫자 선택
            const winningNumber = Math.floor(Math.random() * 36) + 1;
            const targetIndex = numbers.indexOf(winningNumber);

            // 해당 숫자가 12시 방향 화살표 위치로 오도록 각도 계산
            const targetSegmentAngle = targetIndex * segmentAngle;
            const extraRounds = 360 * 5; // 최소 5바퀴 회전
            const targetAngle = extraRounds + (360 - targetSegmentAngle) - (segmentAngle / 2);

            currentRotation += targetAngle - (currentRotation % 360);
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // 4초 후 회전이 끝나면 결과 출력
            setTimeout(() => {
                isSpinning = false;
                const colorName = (winningNumber % 2 !== 0) ? "붉은색(홀수)" : "검은색(짝수)";
                resultDiv.innerText = `🎉 당첨 결과: ${winningNumber}번 [${colorName}] 🎉`;
            }, 4000);
        }

        // 초기 룰렛 화면 출력
        drawWheel();
    </script>
</body>
</html>
